<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASAL — Administrator Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="sun"></div>
<svg class="field-rows" viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0,400 L0,220 Q360,160 720,220 T1440,220 L1440,400 Z" fill="#B7C68A" opacity="0.55"/>
  <path d="M0,400 L0,270 Q360,230 720,270 T1440,270 L1440,400 Z" fill="#93AE68" opacity="0.6"/>
  <path d="M0,400 L0,320 Q360,300 720,320 T1440,320 L1440,400 Z" fill="#6E8F4E" opacity="0.75"/>
</svg>
<div class="topbar">
  <a href="../home.html" class="home-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Back to home
  </a>
</div>
<div class="page-center">
<div class="wrap">
  <div class="brand-row">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 6 6.5 6 12.5C6 16.09 8.69 19 12 19C15.31 19 18 16.09 18 12.5C18 6.5 12 2 12 2Z" fill="#C97A2B"/><path d="M12 19V22" stroke="#4A2E1E" stroke-width="1.6" stroke-linecap="round"/></svg>
    <h1>FASAL</h1>
  </div>
  <div class="card">
    <div class="step-title">Administrator Portal</div>
    <div class="step-sub">Sign in with authorized administrative credentials.</div>
    <div style="background: #FAF8F2; border: 1px dashed var(--harvest); padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; font-size: 0.8rem; color: var(--soil);">
      <strong>🛡️ Demo Admin Credentials:</strong><br>
      • Username: <code>admin</code><br>
      • Password: <code>AdminPassword@123</code>
    </div>
    <div class="field" id="usernameField">
      <label for="username">Admin Username</label>
      <input type="text" id="username" placeholder="Username" value="admin">
      <div class="err">Username is required.</div>
    </div>
    <div class="field" id="passwordField">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" value="AdminPassword@123">
      <div class="err">Password is required.</div>
    </div>
    <button class="btn" id="loginBtn" style="margin-top: 14px; background: #C97A2B;">Sign In as Admin</button>
    <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); text-align: center; font-size: 0.85rem; color: var(--muted);">
      Notice: Public admin registration is disabled per security specification.
    </div>
  </div>
</div>
</div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/chatbot.js"></script>
<script>
document.getElementById('loginBtn').addEventListener('click', async () => {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  let ok = true;
  if (!u) { document.getElementById('usernameField').classList.add('invalid'); ok = false; }
  else document.getElementById('usernameField').classList.remove('invalid');
  if (!p) { document.getElementById('passwordField').classList.add('invalid'); ok = false; }
  else document.getElementById('passwordField').classList.remove('invalid');
  if (!ok) return;

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    await api.loginAdmin(u, p);
    showToast('Admin login successful!', 'success');
    setTimeout(() => { window.location.href = '/admin/dashboard.html'; }, 600);
  } catch (err) {
    showToast(err.message || 'Invalid admin credentials.', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In as Admin';
  }
});
</script>
</body>
</html>
